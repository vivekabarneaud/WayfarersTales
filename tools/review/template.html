<title>Wayfarer's Tales Line Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a sticky review bar on top, then one column of line cards grouped by place or moment. */
:root {
  --bg: #eef0ec;
  --surface: #fbfcf9;
  --ink: #1d2420;
  --muted: #5d6a63;
  --line: #d3d9d3;
  --accent: #8a6a12;       /* quest-text gold, darkened for light paper */
  --accent-soft: #f3ead2;
  --keep: #2f7a4b; --keep-soft: #dcefe2;
  --tweak: #9a5a00; --tweak-soft: #f6e6c9;
  --remove: #a33a32; --remove-soft: #f4dcd9;
  --font-line: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --surface: #1c2320; --ink: #e6ebe7; --muted: #9aa8a0; --line: #2e3833;
    --accent: #e0bb55; --accent-soft: #3a3220;
    --keep: #6fcf91; --keep-soft: #1f3a2a; --tweak: #f0b45a; --tweak-soft: #3d2f18; --remove: #f08a80; --remove-soft: #42241f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1c2320; --ink: #e6ebe7; --muted: #9aa8a0; --line: #2e3833;
  --accent: #e0bb55; --accent-soft: #3a3220;
  --keep: #6fcf91; --keep-soft: #1f3a2a; --tweak: #f0b45a; --tweak-soft: #3d2f18; --remove: #f08a80; --remove-soft: #42241f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px; }
.bar h1 { font-family: var(--font-line); font-weight: 600; font-size: 1.15rem; margin: 0; text-wrap: balance; }
.bar h1 small { display: block; font-family: var(--font-ui); font-weight: 500; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.progress { flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
button { font: inherit; cursor: pointer; }
.btn-primary { background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 700; }
.btn-primary:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 14px 6px; }
.tab { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 0.9rem; }
.tab span { color: var(--muted); font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tab[aria-selected="true"] span { color: var(--surface); opacity: .75; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 6px 4px; }
.filters input, .filters select { font: inherit; font-size: 0.9rem; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.filters input { flex: 1 1 220px; }
.hint { font-size: 0.82rem; color: var(--muted); padding-block: 4px 8px; }

.general { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-block: 8px 4px; }
.general label { font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 6px; }
textarea { width: 100%; font: inherit; font-size: 0.9rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; min-height: 56px; }

.group { margin-block: 22px 0; }
.group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
.group-head h2 { font-family: var(--font-line); font-size: 1.05rem; font-weight: 600; margin: 0; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.group-head .count { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.linkish { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 0.82rem; padding: 2px 0; }
.linkish:hover { text-decoration: underline; }

.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card[data-status="keep"] { border-left-color: var(--keep); }
.card[data-status="tweak"] { border-left-color: var(--tweak); }
.card[data-status="remove"] { border-left-color: var(--remove); }
.fr { font-family: var(--font-line); font-size: 1.02rem; line-height: 1.55; }
.card[data-status="remove"] .fr { text-decoration: line-through; text-decoration-color: var(--remove); }
.en { font-family: var(--font-line); font-style: italic; color: var(--muted); font-size: 0.9rem; }
.meta { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 0.74rem; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.chip.kind { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
.chip.long { border-style: dashed; }
.note { font-size: 0.8rem; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.st { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 5px 12px; font-size: 0.85rem; font-weight: 600; }
.st[data-v="keep"][aria-pressed="true"] { background: var(--keep-soft); border-color: var(--keep); color: var(--keep); }
.st[data-v="tweak"][aria-pressed="true"] { background: var(--tweak-soft); border-color: var(--tweak); color: var(--tweak); }
.st[data-v="remove"][aria-pressed="true"] { background: var(--remove-soft); border-color: var(--remove); color: var(--remove); }
.actions .linkish { margin-left: auto; }
.empty { color: var(--muted); padding-block: 30px; text-align: center; }

.export { margin-block: 16px; background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 14px; }
.export p { margin: 0 0 8px; font-size: 0.88rem; }
.export textarea { min-height: 140px; font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: 1; }
footer { color: var(--muted); font-size: 0.8rem; padding-block: 30px 40px; }

.news { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; margin-block: 10px 2px; font-size: 0.9rem; }
.news b { font-weight: 700; }
.news button { margin-left: auto; }
.zonebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 4px 2px; }
.zonebar input, .zonebar select { font: inherit; font-size: 0.9rem; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.zonebar input { flex: 1 1 200px; }
.zonebar label.chk { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.zoneinfo { font-size: 0.85rem; color: var(--muted); padding-block: 2px 6px; }
.zoneinfo b { color: var(--ink); }
.badge { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; align-self: flex-start; }
.badge.new { background: var(--accent); color: var(--surface); }
.badge.rw { background: var(--ink); color: var(--surface); }
.now { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; border-left: 2px solid var(--line); }
.now .lbl, .proposed .lbl { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.now .fr { color: var(--muted); font-size: 0.92rem; }
.proposed { display: flex; flex-direction: column; gap: 2px; }
.chip.check { background: var(--tweak-soft); color: var(--tweak); border-color: transparent; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar">
  <div class="wrap bar-inner">
    <h1><small>Wayfarer's Tales</small>Line review</h1>
    <div class="progress">
      <div id="progressText">0 of 0 lines reviewed</div>
      <div class="meter"><i id="progressBar"></i></div>
    </div>
    <button class="btn-primary" id="copyBtn" type="button">Copy JSON</button>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>

  <div class="filters">
    <input id="search" type="search" placeholder="Search a word in French or English" aria-label="Search lines">
    <select id="statusFilter" aria-label="Show">
      <option value="all">All lines</option>
      <option value="todo">Not reviewed yet</option>
      <option value="keep">Keep</option>
      <option value="tweak">Tweak</option>
      <option value="remove">Remove</option>
      <option value="noted">With a note</option>
      <option value="proposals">New drafts and rewrites</option>
    </select>
    <select id="groupFilter" aria-label="Group"></select>
  </div>
  <div class="zonebar" id="zoneBar">
    <input id="zoneInput" list="zoneList" placeholder="Zone: type a name, e.g. Teldrassil" aria-label="Zone" autocomplete="off">
    <datalist id="zoneList"></datalist>
    <select id="placeFilter" aria-label="Place in this zone" hidden></select>
    <label class="chk"><input type="checkbox" id="hideGeneral"> Hide lines that play everywhere</label>
  </div>
  <p class="zoneinfo" id="zoneInfo"></p>
  <div class="news" id="news"></div>
  <p class="hint" id="hint"></p>

  <div class="general">
    <label for="generalNote">General notes (ideas, things that apply to many lines)</label>
    <textarea id="generalNote" placeholder="For example: fewer exclamation marks in the pet lines…"></textarea>
  </div>

  <div id="exportBox" class="export" hidden>
    <p>Copying didn't work here. Select all the text below, copy it, and paste it to Claude.</p>
    <textarea id="exportText" readonly aria-label="Review JSON"></textarea>
  </div>

  <div id="list"></div>
  <footer>Your choices are kept in this browser while you review. When you're done, press <b>Copy JSON</b> and paste it in the chat.</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const RAW = __DATA__;
const DATA = RAW.lines;
const ZONES = RAW.zones;
// Rewrite proposals kept outside the addon until approved
const RW = __REWRITES__;
DATA.forEach((d) => { const r = RW[d.id]; if (r && !d.rewrite) d.rewrite = { en: r.en, fr: r.fr, when: r.when }; });
// French zone names, only to help searching
const ZONE_FR = {
  "Alterac Mountains": "Montagnes d'Alterac", "Arathi Highlands": "Hautes-terres d'Arathi", "Badlands": "Terres ingrates",
  "Blasted Lands": "Terres foudroyées", "Tirisfal Glades": "Clairières de Tirisfal", "Silverpine Forest": "Forêt des Pins-Argentés",
  "Western Plaguelands": "Maleterres de l'Ouest", "Eastern Plaguelands": "Maleterres de l'Est", "Hillsbrad Foothills": "Contreforts de Hautebrande",
  "The Hinterlands": "Les Hinterlands", "Dun Morogh": "Dun Morogh", "Searing Gorge": "Gorge des Vents brûlants", "Burning Steppes": "Steppes ardentes",
  "Elwynn Forest": "Forêt d'Elwynn", "Deadwind Pass": "Défilé de Deuillevent", "Duskwood": "Bois de la Pénombre", "Loch Modan": "Loch Modan",
  "Redridge Mountains": "Les Carmines", "Stranglethorn Vale": "Vallée de Strangleronce", "Swamp of Sorrows": "Marais des Chagrins",
  "Westfall": "Marche de l'Ouest", "Wetlands": "Les Paluns", "Stormwind": "Hurlevent", "Ironforge": "Forgefer", "Undercity": "Fossoyeuse",
  "Durotar": "Durotar", "Mulgore": "Mulgore", "The Barrens": "Les Tarides", "Teldrassil": "Teldrassil", "Darkshore": "Sombrivage",
  "Ashenvale": "Orneval", "Thousand Needles": "Mille pointes", "Stonetalon Mountains": "Les Serres-Rocheuses", "Desolace": "Désolace",
  "Feralas": "Féralas", "Dustwallow Marsh": "Marécage d'Âprefange", "Tanaris": "Tanaris", "Azshara": "Azshara", "Felwood": "Gangrebois",
  "Un'Goro Crater": "Cratère d'Un'Goro", "Moonglade": "Reflet-de-Lune", "Silithus": "Silithus", "Winterspring": "Berceau-de-l'Hiver",
  "Orgrimmar": "Orgrimmar", "Thunder Bluff": "Les Pitons-du-Tonnerre", "Darnassus": "Darnassus",
};
const zoneLabel = (z) => z.name + (ZONE_FR[z.name] && ZONE_FR[z.name] !== z.name ? " / " + ZONE_FR[z.name] : "");
let currentZone = null;

const SECTIONS = [
  { key: "Places", label: "Places", hint: "Ambiance lines: anywhere, by landscape, zone, place or spot. \"First visit\" lines play the first time you arrive; \"now and then\" lines play on the timers." },
  { key: "Moments", label: "Moments", hint: "Things that happen to you: meals, fights, gathering, travel, professions, loot, new character…" },
  { key: "Pet", label: "Pet", hint: "Your companion's reactions. Some groups change with your bond (shy, friendly, devoted) or the pet's body type (bird, scaly, chitin)." },
  { key: "Body", label: "Body", hint: "The Elements module: cold, heat, wetness, thirst, hunger and energy." },
];

const POOL_LABELS = {
  newPet: "Meeting a new pet", newPetHistory: "A pet the addon already knows", rename: "Pet renamed", summon: "Summoning the pet",
  reunion: "Back together after a while", stableReunion: "Back from the stable", stableMissed: "Missed you in the stable",
  affection: "Cuddles (/pet, /hug…)", playful: "Playful emotes (/dance, /cheer…)", chicken: "/chicken", roar: "/roar",
  rest: "Resting emotes (/sit, /sleep…)", sad: "Sad emotes (/cry…)", greet: "Greetings (/wave, /hello…)", hungry: "/hungry",
  rude: "Rude emotes", sorryForgive: "Saying sorry (forgiven)", sorryNothing: "Saying sorry (nothing to forgive)",
  afkDoze: "You go AFK", afkBack: "Back from AFK", afkBackLong: "Back after a long AFK",
  greetMorning: "Login greeting: morning", greetAfternoon: "Login greeting: afternoon", greetEvening: "Login greeting: evening", greetNight: "Login greeting: night",
  newZone: "New zone together", playerLevel: "You level up", petLevel: "Pet levels up (asks for cheers)",
  feedFavoriteFirst: "Favourite food discovered", favoriteRevealed: "Favourite revealed during a shared meal", feedFavorite: "Eating its favourite",
  feedDislikeFirst: "Disliked food discovered", feedDislike: "Eating food it dislikes", lootFavorite: "Spots its favourite in your loot",
  treatAsk: "Asks for food you just looted", treatAskFavorite: "Asks for its favourite you just looted", treatGiven: "Treat given in time",
  celebrated: "You cheered its level", mood_playful: "Mood of the day: playful", mood_sleepy: "Mood of the day: sleepy", mood_cuddly: "Mood of the day: cuddly",
  mood_curious: "Mood of the day: curious", mood_hungry: "Mood of the day: peckish", idleMood_playful: "Idle, playful mood", idleMood_sleepy: "Idle, sleepy mood",
  idleMood_cuddly: "Idle, cuddly mood", idleMood_curious: "Idle, curious mood", idleMood_hungry: "Idle, peckish mood",
  modePassive: "Set to passive", modeDefensive: "Set to defensive", modeAggressive: "Set to aggressive", daysTogether: "Days together", anniversary: "Anniversary",
  otherEmote: "Other emotes aimed at it", attentionRequest: "Asks for cuddles", attentionAnswered: "Cuddle request answered", attentionExpired: "Gives up waiting for cuddles",
  comfort: "Comforted after a fight", feed: "Fed", lootFood: "Notices food in your loot", fishing: "You catch fish", cooking: "You cook",
  mealRequest: "Asks for a bite of your meal", mealSniff: "Food it won't eat", mealShared: "Meal shared", mealOther: "Fed something else during your meal",
  mealExpired: "Gives up asking for a bite", campfireNear: "Near a campfire", campfireRest: "Sitting together at a campfire", campfireEnergized: "Rested after the campfire",
  kill: "After a kill", death: "Pet dies", revive: "Pet revived", petHungry: "Pet is hungry", idle: "Idle moments", idleSwimming: "Idle while swimming",
  idleResting: "Idle in a city or inn", idleNight: "Idle at night", followAfterStay: "Follow after a long Stay", tierUp: "Bond grows a stage", loyaltyUp: "Loyalty grows",
  petDangerHigh: "Senses great danger", petDangerMid: "Senses danger", petDangerNone: "Feels safe (low-level area)", petDangerNear: "Senses a dangerous creature",
  coldEnter: "Getting cold", freezingEnter: "Freezing", coldRemind: "Still cold", freezingRemind: "Still freezing", warmBack: "Warm again",
  hotEnter: "Getting hot", overheatEnter: "Overheating", hotRemind: "Still hot", overheatRemind: "Still overheating", coolBack: "Cooled down",
  soaked: "Soaked after swimming", dry: "Dry again", body_thirsty: "Thirsty", body_parched: "Parched", drinkRelief: "Thirst quenched",
  body_hungry: "Hungry", body_starving: "Starving", eatRelief: "Hunger satisfied", body_tired: "Tired", body_exhausted: "Exhausted", restRelief: "Rested",
  fireWarm: "Warming up by a fire", indoorsWarm: "Warming up indoors",
};

const STORE_KEY = "wt-line-review-v1";
let state = { reviews: {}, general: "", tab: "Places" };
try { const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (saved) state = Object.assign(state, saved); } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

// Notes Claude has already handled (handled.json): cleared from this page, as long as
// the note is still the same text (a new comment on the same line stays).
const HANDLED = __HANDLED__;
(function clearHandled() {
  let n = 0;
  for (const h of HANDLED) {
    if (h.id === "general") {
      if ((state.general || "").trim() === (h.comment || "").trim()) { state.general = ""; n++; }
      continue;
    }
    const r = state.reviews[h.id];
    if (!r) continue;
    if ((r.comment || "").trim() === (h.comment || "").trim()) { delete state.reviews[h.id]; n++; }
  }
  if (n) save();
})();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const groupLabel = (g) => POOL_LABELS[g] || g;
const rev = (id) => state.reviews[id] || {};
function setRev(id, patch) {
  const r = Object.assign({}, rev(id), patch);
  if (!r.status && !(r.comment && r.comment.trim())) delete state.reviews[id]; else state.reviews[id] = r;
  save(); updateProgress();
}

function renderTabs() {
  $("tabs").innerHTML = SECTIONS.map((s) => {
    const n = DATA.filter((d) => d.section === s.key).length;
    return `<button class="tab" role="tab" type="button" data-tab="${s.key}" aria-selected="${s.key === state.tab}">${s.label}<span>${n}</span></button>`;
  }).join("");
  const sec = SECTIONS.find((s) => s.key === state.tab);
  $("hint").textContent = sec ? sec.hint : "";
  const places = state.tab === "Places";
  $("zoneBar").hidden = !places;
  $("zoneInfo").hidden = !places;
  const drafts = DATA.filter((d) => d.section === state.tab && d.draft).length;
  const rewrites = DATA.filter((d) => d.section === state.tab && d.rewrite).length;
  $("news").hidden = !(drafts || rewrites);
  $("news").innerHTML = `<span>Waiting for you here: <b>${drafts} new draft line${drafts === 1 ? "" : "s"}</b> and <b>${rewrites} rewrite${rewrites === 1 ? "" : "s"}</b>.</span>
    <button type="button" class="linkish" id="showProposals">Show only these</button>`;
  const groups = [...new Set(DATA.filter((d) => d.section === state.tab).map((d) => d.group))];
  $("groupFilter").innerHTML = `<option value="">All groups</option>` + groups.map((g) => `<option value="${esc(g)}">${esc(groupLabel(g))}</option>`).join("");
}

const isGeneral = (d) => d.section === "Places" && !d.zone && !d.biome;
const isPlaceGroup = (g) => g.startsWith("Place: ") || g.startsWith("Spot: ");
// Can this line play somewhere in zone z?
function inZone(d, z) {
  if (d.zone) return d.zone === z.id;
  if (d.biome) return d.biome === z.biome;
  return true; // anywhere, weather, danger feelings
}

function matches(d) {
  if (d.section !== state.tab) return false;
  const g = $("groupFilter").value; if (g && d.group !== g) return false;
  if (d.section === "Places") {
    if ($("hideGeneral").checked && isGeneral(d)) return false;
    if (currentZone) {
      if (!inZone(d, currentZone)) return false;
      const p = $("placeFilter").value;
      if (p && isPlaceGroup(d.group) && d.group !== p) return false;
    }
  }
  const r = rev(d.id), f = $("statusFilter").value;
  if (f === "todo" && r.status) return false;
  if (["keep", "tweak", "remove"].includes(f) && r.status !== f) return false;
  if (f === "noted" && !(r.comment && r.comment.trim())) return false;
  if (f === "proposals" && !(d.draft || d.rewrite)) return false;
  const q = $("search").value.trim().toLowerCase();
  if (q && !((d.fr || "") + " " + (d.en || "") + " " + groupLabel(d.group)).toLowerCase().includes(q)) return false;
  return true;
}

function cardHTML(d) {
  const r = rev(d.id);
  const chips = [];
  if (d.kind) chips.push(`<span class="chip kind">${esc(d.kind)}</span>`);
  if (d.when) d.when.split(" · ").forEach((w) => chips.push(`<span class="chip">${esc(w)}</span>`));
  if (d.long) chips.push(`<span class="chip long">long line</span>`);
  const showNote = !!(r.comment || r.status === "tweak" || r.open);
  if (d.check) chips.push(`<span class="chip check">check the French name: ${esc(d.check)}</span>`);
  const btn = (v, label) => `<button type="button" class="st" data-v="${v}" aria-pressed="${r.status === v}">${label}</button>`;
  const proposal = d.draft || d.rewrite;
  let body;
  if (d.rewrite) {
    const rw = d.rewrite;
    const newWhen = rw.when ? `<div class="meta">${rw.when.split(" · ").map((w) => `<span class="chip">${esc(w)}</span>`).join("")}</div>` : "";
    body = `<span class="badge rw">Rewrite proposal</span>
      <div class="now"><span class="lbl">Now</span><div class="fr">${esc(d.fr)}</div></div>
      <div class="proposed"><span class="lbl">Proposed</span><div class="fr">${esc(rw.fr)}</div><div class="en">${esc(rw.en)}</div></div>
      ${newWhen ? `<div class="note">New conditions:</div>${newWhen}` : ""}`;
  } else {
    body = `${d.draft ? `<span class="badge new">New line, draft</span>` : ""}
      <div class="fr">${esc(d.fr || "(no French text)")}</div>
      <div class="en">${esc(d.en || "")}</div>`;
  }
  return `<article class="card" data-id="${esc(d.id)}" data-status="${r.status || ""}">
    ${body}
    ${chips.length ? `<div class="meta">${chips.join("")}</div>` : ""}
    ${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}
    <div class="actions">${btn("keep", proposal ? "Approve" : "Keep")}${btn("tweak", "Tweak")}${btn("remove", proposal ? "Reject" : "Remove")}
      <button type="button" class="linkish addnote" ${showNote ? "hidden" : ""}>Add a note</button></div>
    <textarea class="cmt" id="note-${esc(d.id)}" placeholder="What should change? You can also write your own version." ${showNote ? "" : "hidden"} aria-label="Note">${esc(r.comment || "")}</textarea>
  </article>`;
}

function render() {
  const items = DATA.filter(matches);
  if (!items.length) { $("list").innerHTML = `<p class="empty">No lines match these filters.</p>`; return; }
  const byGroup = new Map();
  items.forEach((d) => { if (!byGroup.has(d.group)) byGroup.set(d.group, []); byGroup.get(d.group).push(d); });
  let html = "";
  byGroup.forEach((list, g) => {
    html += `<section class="group"><div class="group-head"><h2>${esc(groupLabel(g))}</h2>
      <span class="count">${list.length} line${list.length > 1 ? "s" : ""}</span>
      <button type="button" class="linkish keepall" data-group="${esc(g)}">Keep all not yet reviewed</button></div>
      <div class="cards">${list.map(cardHTML).join("")}</div></section>`;
  });
  $("list").innerHTML = html;
}

function updateProgress() {
  const total = DATA.length;
  const done = DATA.filter((d) => rev(d.id).status).length;
  $("progressText").textContent = `${done} of ${total} lines reviewed`;
  $("progressBar").style.width = (total ? (done / total) * 100 : 0) + "%";
}

function exportJSON() {
  const reviews = DATA.filter((d) => state.reviews[d.id]).map((d) => {
    const r = state.reviews[d.id];
    const o = { id: d.id, status: r.status || "note" };
    if (d.draft) o.proposal = "new";
    if (d.rewrite) o.proposal = "rewrite";
    if (r.comment && r.comment.trim()) o.comment = r.comment.trim();
    if (r.status !== "keep" || o.comment) o.fr = d.rewrite ? d.rewrite.fr : d.fr;
    return o;
  });
  return JSON.stringify({ review: "wayfarers-tales-lines", date: new Date().toISOString().slice(0, 10),
    general: (state.general || "").trim(), counts: {
      keep: reviews.filter((r) => r.status === "keep").length, tweak: reviews.filter((r) => r.status === "tweak").length,
      remove: reviews.filter((r) => r.status === "remove").length }, reviews }, null, 1);
}

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); }

$("copyBtn").addEventListener("click", () => {
  const text = exportJSON();
  const fallback = () => { $("exportBox").hidden = false; $("exportText").value = text; $("exportText").focus(); $("exportText").select(); };
  try {
    navigator.clipboard.writeText(text).then(() => { $("exportBox").hidden = true; toast("Copied. Paste it in the chat."); }, fallback);
  } catch (e) { fallback(); }
});

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.tab = b.dataset.tab; save(); $("groupFilter").value = ""; renderTabs(); render(); window.scrollTo(0, 0);
});
["search", "statusFilter", "groupFilter"].forEach((id) => $(id).addEventListener("input", render));

$("list").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  const keepAll = e.target.closest(".keepall");
  if (keepAll) {
    DATA.filter((d) => d.section === state.tab && d.group === keepAll.dataset.group && !rev(d.id).status && matches(d))
      .forEach((d) => setRev(d.id, { status: "keep" }));
    render(); toast("Marked as keep"); return;
  }
  if (!card) return;
  const id = card.dataset.id;
  const st = e.target.closest(".st");
  if (st) {
    const v = st.dataset.v, cur = rev(id).status;
    setRev(id, { status: cur === v ? undefined : v });
    const r = rev(id);
    card.dataset.status = r.status || "";
    card.querySelectorAll(".st").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === r.status)));
    if (r.status === "tweak") { card.querySelector(".cmt").hidden = false; card.querySelector(".addnote").hidden = true; card.querySelector(".cmt").focus(); }
    return;
  }
  if (e.target.closest(".addnote")) {
    const ta = card.querySelector(".cmt"); ta.hidden = false; e.target.closest(".addnote").hidden = true; ta.focus();
  }
});
$("list").addEventListener("input", (e) => {
  if (!e.target.classList.contains("cmt")) return;
  setRev(e.target.closest(".card").dataset.id, { comment: e.target.value });
});
$("generalNote").value = state.general || "";
$("generalNote").addEventListener("input", (e) => { state.general = e.target.value; save(); });

// Zone view (Places): type a zone, see every line that can play there
$("zoneList").innerHTML = ZONES.slice().sort((a, b) => a.name.localeCompare(b.name))
  .map((z) => `<option value="${esc(zoneLabel(z))}"></option>`).join("");
function findZone(text) {
  const q = text.trim().toLowerCase();
  if (!q) return null;
  const names = (z) => [z.name, ZONE_FR[z.name] || "", zoneLabel(z)].map((s) => s.toLowerCase());
  return ZONES.find((z) => names(z).includes(q))
    || (ZONES.filter((z) => names(z).some((n) => n.includes(q))).length === 1
      ? ZONES.find((z) => names(z).some((n) => n.includes(q))) : null);
}
function updateZone() {
  currentZone = findZone($("zoneInput").value);
  const pf = $("placeFilter");
  if (!currentZone) {
    pf.hidden = true; pf.innerHTML = "";
    $("zoneInfo").innerHTML = $("zoneInput").value.trim() ? "No zone matches yet: keep typing, or pick one from the list." : "";
    render(); return;
  }
  const z = currentZone;
  const own = DATA.filter((d) => d.section === "Places" && d.zone === z.id);
  const places = [...new Set(own.filter((d) => isPlaceGroup(d.group)).map((d) => d.group))];
  pf.innerHTML = `<option value="">Everywhere in this zone</option>` + places.map((g) => `<option value="${esc(g)}">${esc(g)}</option>`).join("");
  pf.hidden = places.length === 0;
  const zoneOwn = own.filter((d) => !isPlaceGroup(d.group));
  const landscape = DATA.filter((d) => d.section === "Places" && d.biome === z.biome).length;
  $("zoneInfo").innerHTML = `<b>${esc(zoneLabel(z))}</b> · landscape: <b>${esc(z.biome)}</b> (${landscape} lines) · its own lines: <b>${zoneOwn.length}</b>`
    + (zoneOwn.some((d) => d.draft) ? ` (${zoneOwn.filter((d) => d.draft).length} drafts)` : "")
    + ` · places with their own lines: <b>${places.length}</b>`;
  render();
}
$("zoneInput").addEventListener("input", updateZone);
$("placeFilter").addEventListener("input", render);
$("hideGeneral").addEventListener("input", render);
$("news").addEventListener("click", (e) => {
  if (e.target.id === "showProposals") { $("statusFilter").value = "proposals"; render(); }
});

renderTabs(); render(); updateProgress();
</script>
